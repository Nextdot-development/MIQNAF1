<!-- DOCTOR SECTION -->
<section id="doctor" class="doctor-section fade-in-on-scroll">
    <div class="doctor-container">
        <div class="doctor-layout-row">
            <div class="left-section">
                <div class="doctor-section-title-wrap" id="doctor-video">
                    <h2 class="doctor-section-title bouncing-title" data-text="The Proven Solution Trusted by Doctors Nationwide">
                        The Proven Solution Trusted by Doctors Nationwide
                    </h2>
                </div>

                <div class="dropdown-row stagger-children">
                    <div class="filter-table" id="doc-dropdown">
                        <div class="filter-head" id="doc-head">
                            Doctor's Name
                            <svg width="10" height="6" viewBox="0 0 14 8" aria-hidden="true" style="margin-top: 4px;"><polyline points="1,1 7,7 13,1" fill="none" stroke="white" stroke-width="1.5"/></svg>
                        </div>
                        <div class="filter-selected doc-selected" id="doctor-selected-text"
                             role="button" tabindex="0"
                             aria-haspopup="listbox" aria-expanded="false"
                             aria-controls="doc-listbox" aria-labelledby="doc-head doctor-selected-text">Dr. Sonam Solanki</div>
                        <div class="filter-list doc-list" id="doc-listbox" role="listbox" aria-label="Doctors"></div>
                    </div>

                    <div class="filter-table" id="city-dropdown">
                        <div class="filter-head" id="city-head">
                            City
                            <svg width="10" height="6" viewBox="0 0 14 8" aria-hidden="true" style="margin-top: 4px;"><polyline points="1,1 7,7 13,1" fill="none" stroke="white" stroke-width="1.5"/></svg>
                        </div>
                        <div class="filter-selected city-selected" id="city-selected-text"
                             role="button" tabindex="0"
                             aria-haspopup="listbox" aria-expanded="false"
                             aria-controls="city-listbox" aria-labelledby="city-head city-selected-text">Mumbai</div>
                        <div class="filter-list city-list" id="city-listbox" role="listbox" aria-label="Cities">
                            <div class="filter-option city-option" data-city="mumbai" role="option" tabindex="-1" aria-selected="true" style="display: none;">Mumbai</div>
                            <div class="filter-option city-option" data-city="chennai" role="option" tabindex="-1" aria-selected="false">Chennai</div>
                            <div class="filter-option city-option" data-city="kolkata" role="option" tabindex="-1" aria-selected="false">Kolkata</div>
                            <div class="filter-option city-option" data-city="delhi" role="option" tabindex="-1" aria-selected="false">Delhi</div>
                        </div>
                    </div>
                </div>
                
                <div class="doctor-info">
                    <span class="doctor-play-icon" aria-hidden="true">
                        <svg viewBox="0 0 806.5 1718.64" xmlns="http://www.w3.org/2000/svg">
                            <polygon fill="#991f25" points="157.06 856.78 0 1718.64 806.5 855.28 22.32 0 157.06 856.78"/>
                        </svg>
                    </span>
                    <div>
                        <h2 id="display-name">Dr. Sonam Solanki</h2>
                        <p id="display-spec">Pulmonologist</p>
                        <p id="display-hospital"><span>INICIO Chest Clinic, Lalbagh</span></p>
                    </div>
                </div>
            </div>
            
            <div class="doctor-image-content">
                <div class="image-container" id="video-container" style="cursor:pointer;">
                    <img id="display-thumbnail" class="doctor-thumbnail" src="thumbnails/dr-sonam-solanki.jpg" alt="Dr. Sonam Solanki">
                    <div id="display-placeholder" class="doctor-thumb-placeholder" hidden aria-hidden="true">
                        <img src="assests/MIQNAF Logo.svg" alt="" class="doctor-thumb-placeholder-logo">
                        <span class="doctor-thumb-placeholder-name"></span>
                        <span class="doctor-thumb-placeholder-note">Video coming soon</span>
                    </div>
                    <div id="display-play-btn" class="doctor-play-btn">
                        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><polygon points="5,3 19,12 5,21"/></svg>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
